<!-- CONTENIDO DE PRODUCTOS -->
<div class="module-container">
    <div class="module-card">
        <!-- Header -->
        <div class="module-header products-module">
            <div>
                <h1 class="module-title">🍕 Gestión de Productos</h1>
                <p class="module-subtitle">Administra el catálogo de productos de tu tienda</p>
            </div>
            <button class="btn-new" id="btnNuevoProducto">
                <span>+</span> Nuevo Producto
            </button>
        </div>
        
        <!-- Mensajes -->
        <div id="messageContainer"></div>
        
        <!-- Tabla -->
        <div class="table-wrapper">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th style="width: 80px;">Imagen</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th style="width: 100px;">Precio</th>
                        <th style="width: 120px;">Categoría</th>
                        <th style="width: 80px;">Stock</th>
                        <th style="width: 100px;">Estado</th>
                        <th style="width: 200px;" class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr>
                        <td colspan="9" class="empty-message">
                            <div class="loading-spinner"></div>
                            <p>Cargando productos...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL PARA CREAR/EDITAR PRODUCTO -->
<div id="productModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-box">
            <!-- Header del Modal -->
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Nuevo Producto</h2>
                <button type="button" class="modal-close">
                    <span>×</span>
                </button>
            </div>
            
            <!-- Formulario -->
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="modal-body">
                    <!-- Campo Nombre -->
                    <div class="form-group">
                        <label class="form-label">Nombre del Producto</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="productName" 
                            placeholder="Ej: Pizza Margarita, Hamburguesa Clásica..."
                            required
                        >
                    </div>
                    
                    <!-- Campo Descripción -->
                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea 
                            class="form-control" 
                            id="productDescription" 
                            placeholder="Describe el producto..."
                            rows="3"
                            required
                        ></textarea>
                    </div>
                    
                    <!-- Fila: Precio y Stock -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Precio ($)</label>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="productPrice" 
                                placeholder="0.00"
                                step="0.01"
                                min="0"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Stock</label>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="productStock" 
                                placeholder="0"
                                min="0"
                                required
                            >
                        </div>
                    </div>
                    
                    <!-- Campo Categoría -->
                    <div class="form-group">
                        <label class="form-label">Categoría</label>
                        <select 
                            class="form-control" 
                            id="productCategory"
                            required
                        >
                            <option value="">Seleccione una categoría</option>
                        </select>
                    </div>
                    
                    <!-- Campo URL de Imagen -->
                    <div class="form-group">
                        <label class="form-label">URL de Imagen</label>
                        <input 
                            type="url" 
                            class="form-control" 
                            id="productImage" 
                            placeholder="https://ejemplo.com/imagen.jpg"
                        >
                        <small class="form-hint">💡 Copia la URL de una imagen desde internet</small>
                    </div>
                    
                    <!-- Campo Estado -->
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <div class="form-check-group">
                            <label class="form-check">
                                <input 
                                    type="checkbox" 
                                    id="productActive"
                                    checked
                                >
                                <span>Producto activo</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Footer del Modal -->
                <div class="modal-footer">
                    <button type="button" class="btn-cancel">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-save" id="btnGuardarProducto">
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
