<!-- CONTENIDO DE PEDIDOS -->
<div class="module-container">
    <div class="module-card">
        <!-- Header -->
        <div class="module-header orders-module">
            <div>
                <h1 class="module-title">📦 Gestión de Pedidos</h1>
                <p class="module-subtitle">Administra y gestiona los pedidos de tu tienda</p>
            </div>
        </div>
        
        <!-- Filtros -->
        <div class="filters-section">
            <div class="filter-group">
                <label for="filterEstado" class="filter-label">Filtrar por estado:</label>
                <select id="filterEstado" class="filter-select">
                    <option value="">Todos los estados</option>
                    <option value="PENDIENTE">Pendiente</option>
                    <option value="CONFIRMADO">Confirmado</option>
                    <option value="TERMINADO">Terminado</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>
        </div>
        
        <!-- Contenedor de pedidos -->
        <div id="ordersContainer" class="orders-grid">
            <div class="loading-message">
                <p>Cargando pedidos...</p>
            </div>
        </div>
    </div>
</div>
